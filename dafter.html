<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دەفتەر">
<meta name="theme-color" content="#4A1D3A">
<title>دەفتەرا پەروکێت بارز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EEF1; --surface:#FFFFFF; --ink:#2B1624; --muted:#7A5E6E;
  --plum:#4A1D3A; --plum-2:#6B2C55; --gold:#B8903A; --gold-soft:#EAD9AE;
  --line:#E4D3DB; --ok:#2E7D5B; --warn:#B7791F; --bad:#B23A48; --blue:#3A6EA5; --busy:#F1D6E2;
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1C1018; --surface:#2A1823; --ink:#F4E7EE; --muted:#C2A5B5;
    --plum:#E7B8D6; --plum-2:#D59BC0; --gold:#DDB65E; --gold-soft:#4A3A1F; --line:#43293A; --busy:#4A2A3D; }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.7;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.btn,.chip,.tabbtn,.badge,dt{font-family:"Noto Kufi Arabic","Noto Naskh Arabic",Tahoma,sans-serif}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
a{color:var(--plum-2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
.note{font-size:13px;color:var(--muted)}

.top{position:sticky;top:0;z-index:20;background:var(--plum);color:#fff;display:flex;justify-content:space-between;align-items:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.top h1{margin:0;font-size:19px;font-weight:800}
.top button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:4px 12px;font-size:13px}
@media (prefers-color-scheme:dark){ .top{background:#3A1630} }
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 0}

.tabbar{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbtn{background:none;border:none;color:var(--muted);padding:6px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.tabbtn span.i{font-size:22px;line-height:1.2}
.tabbtn[aria-selected="true"]{color:var(--plum)}
.tabbtn .cnt{position:absolute;top:0;inset-inline-end:calc(50% - 26px);background:var(--bad);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.sect{margin:18px 0 8px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.sect.bad{color:var(--bad)} .sect.gold{color:var(--gold)} .sect.blue{color:var(--blue)}
.datebar{font-family:"Noto Kufi Arabic",sans-serif;color:var(--muted);font-size:14px}
.allgood{text-align:center;color:var(--ok);padding:26px 10px;font-weight:700}

.btn{border:none;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700}
.btn-main{background:var(--plum);color:var(--bg)}
.btn-gold{background:var(--gold);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--plum);color:var(--bg);border-color:var(--plum)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;text-align:right;color:inherit;display:flex;flex-direction:column}
.dpic{aspect-ratio:3/4;background:linear-gradient(160deg,var(--gold-soft),var(--bg));display:grid;place-items:center;font-size:48px}
.dpic img{width:100%;height:100%;object-fit:cover}
.dcard .b{padding:10px 12px 12px}
.dcard h3{margin:0;font-size:15px}
.price{font-size:13px;color:var(--muted)} .price b{color:var(--gold)}
.state{display:inline-block;font-size:12px;border-radius:8px;padding:0 8px;margin-top:4px;font-family:"Noto Kufi Arabic",sans-serif}
.state.free{background:#DDF0E6;color:#1F5E43} .state.booked{background:var(--gold-soft);color:#6B4F10}
.state.out{background:#DCE8F5;color:#2A4F7A} .state.bad{background:#F6D9DD;color:#8A2432}
@media (prefers-color-scheme:dark){ .state.free{background:#1F3A2F;color:#9AD9BA} .state.booked{color:#EBD28F} .state.out{background:#1F3248;color:#9BC3EE} .state.bad{background:#47202A;color:#F2A9B4} }
.fab{position:fixed;inset-inline-start:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:999px;box-shadow:0 8px 20px rgba(74,29,58,.3);padding:13px 20px}

.rent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;border-inline-start:5px solid var(--gold)}
.rent.out{border-inline-start-color:var(--blue)} .rent.returned{border-inline-start-color:var(--ok);opacity:.85} .rent.late{border-inline-start-color:var(--bad)}
.rhead{display:flex;gap:10px;align-items:center}
.thumb{width:54px;height:68px;border-radius:10px;overflow:hidden;background:var(--gold-soft);display:grid;place-items:center;font-size:26px;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.rinfo{flex:1;min-width:0}
.rinfo h3{margin:0;font-size:16px}
.meta{color:var(--muted);font-size:14px}
.badge{font-size:12px;border-radius:8px;padding:1px 10px;color:#fff;white-space:nowrap}
.badge.booked{background:var(--warn)} .badge.out{background:var(--blue)} .badge.returned{background:var(--ok)}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 6px}
.dates div{background:var(--bg);border-radius:10px;padding:6px 8px}
.dates dt{font-size:12px;color:var(--muted);margin:0}
.dates dd{margin:0;font-size:14px;line-height:1.4;font-weight:600}
.dates small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.money{font-size:14px}
.money b{color:var(--gold)}
.disc{color:var(--bad)}

dialog{border:none;border-radius:20px;padding:0;width:min(560px,96vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(30,10,25,.55)}
.dlg{padding:18px;overflow:auto;max-height:92vh}
.dlg h2{margin:0 0 6px;color:var(--plum);font-size:21px}
.close{float:left;background:none;border:none;font-size:28px;color:var(--muted);line-height:1}
label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr;gap:0}
.msg{margin-top:10px;font-size:15px;min-height:1.4em}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.preview{width:140px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--gold-soft);display:grid;place-items:center;font-size:46px;margin:10px auto 0}
.preview img{width:100%;height:100%;object-fit:cover}
.total{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:12px;font-size:15px}
.total b{color:var(--gold)}

.cal{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cal-head b{font-family:"Noto Kufi Arabic",sans-serif;font-size:15px}
.cal-head button{background:var(--bg);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .wd{font-size:12px;color:var(--muted)}
.day{aspect-ratio:1;border-radius:8px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.day.busy{background:var(--busy)} .day.pick{background:var(--blue);color:#fff} .day.wed{background:var(--gold);color:#fff} .day.ret{background:var(--ok);color:#fff}
.day.today{outline:2px solid var(--plum)}
.day i{font-style:normal;font-size:9px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:4px;vertical-align:middle;background:var(--c)}

.auth{min-height:80vh;display:grid;place-items:center;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:30px 22px;width:min(420px,100%);text-align:center;box-shadow:0 20px 50px rgba(74,29,58,.1)}
.auth-card .lock{font-size:44px}
.auth-card h2{margin:8px 0 2px;font-size:23px}
.auth-card label{text-align:right}
.auth-card .alt{margin-top:14px;font-size:14px;color:var(--muted)}
.banner{background:var(--gold-soft);color:#3A2C08;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.loading{text-align:center;color:var(--muted);padding:50px 0}
@media (prefers-reduced-motion:no-preference){ dialog[open]{animation:pop .18s ease-out} @keyframes pop{from{transform:translateY(8px);opacity:0}} }
</style>
</head>
<body>

<!-- login -->
<div id="login" class="hide"><div class="auth"><div class="auth-card">
  <div class="lock">📒</div>
  <h2 id="lTitle">دەفتەرا پەروکێت بارز</h2>
  <p class="note" style="margin:0 0 8px">ب ئیمەیل و وشا نهێنی بچە ژوور. تەنێ تو دشێی داتایێن خۆ ببینی.</p>
  <label>ئیمەیل<input id="lEmail" type="email" dir="ltr" autocomplete="email" placeholder="shop@example.com"></label>
  <label>وشا نهێنی<input id="lPass" type="password" dir="ltr" autocomplete="current-password"></label>
  <div class="msg" id="lMsg"></div>
  <button class="btn btn-main btn-block" id="lGo">چوونا ژوور</button>
  <div class="alt"><a href="#" id="lForgot">وشا نهێنی ژبیرکر؟</a></div>
  <div class="alt"><a href="#" id="lToggle">هەژمارەکا نوو دروست بکە</a></div>
</div></div></div>

<!-- app shell -->
<div id="shell" class="hide">
  <header class="top"><h1>📒 دەفتەرا پەروکێت بارز</h1><button id="logout">دەرکەفتن</button></header>
  <div class="wrap"><div id="errBox"></div><div id="view"><div class="loading">تێتە بارکرن…</div></div></div>
  <button class="btn btn-gold fab hide" id="fab"></button>
  <nav class="tabbar" role="tablist">
    <button class="tabbtn" role="tab" data-tab="today" aria-selected="true"><span class="i">🔔</span>ئەڤرۆ<span class="cnt hide" id="cnt"></span></button>
    <button class="tabbtn" role="tab" data-tab="dresses" aria-selected="false"><span class="i">👗</span>کراس</button>
    <button class="tabbtn" role="tab" data-tab="rentals" aria-selected="false"><span class="i">📅</span>ئیجار</button>
  </nav>
</div>

<!-- dialogs -->
<dialog id="dDlg"><div class="dlg" id="dBody"></div></dialog>
<dialog id="dfDlg"><div class="dlg" id="dfBody"></div></dialog>
<dialog id="rfDlg"><div class="dlg" id="rfBody"></div></dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDF0R5sCCG-AGg-e1rbqduCsgewNTDKerY",
  authDomain: "barz-dresses.firebaseapp.com",
  projectId: "barz-dresses",
  storageBucket: "barz-dresses.firebasestorage.app",
  messagingSenderId: "936197200238",
  appId: "1:936197200238:web:8aa274dec8a68ea4b3497f"
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

const MONTHS = ["کانوونا دووێ","شوبات","ئادار","نیسان","گولان","حزیران","تیرمەه","ئاب","ئەیلوول","چریا ئێکێ","چریا دووێ","کانوونا ئێکێ"];
const WD = ["ئێکشەمب","دووشەمب","سێشەمب","چارشەمب","پێنجشەمب","ئینی","شەمبی"];
const WDC = ["ش","١ش","٢ش","٣ش","٤ش","٥ش","ئ"]; // Saturday first
const STATUS = { booked:"حجزکری", out:"هاتە برن", returned:"هاتە زڤڕاندن" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P = s => new Date(s+"T12:00:00");
const todayS = () => ymd(new Date());
const addD = (s,n) => { const d = P(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((P(b)-P(a))/864e5);
const fmt = s => { const d = P(s); return `${WD[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""}`; };
const rel = s => { const n = diff(todayS(), s);
  return n===0 ? "ئەڤرۆ" : n===1 ? "سبەی" : n===-1 ? "دوهی" : n>1 ? `پشتی ${n} رۆژان` : `${-n} رۆژ بەری نوکە`; };
const money = n => (Number(n)||0).toLocaleString("en") + " د.ع";
const ts = v => v?.toMillis ? v.toMillis() : 0;

const S = { user:null, dresses:[], rentals:[], tab:"today", filter:"active", unsubs:[],
  cal:{dressId:null,y:0,m:0}, openDressId:null, editDress:null, newImg:null, editRental:null };

const authErr = c => ({
  "auth/invalid-credential":"ئیمەیل یان وشا نهێنی خەلەتە.", "auth/wrong-password":"ئیمەیل یان وشا نهێنی خەلەتە.",
  "auth/user-not-found":"ئیمەیل یان وشا نهێنی خەلەتە.", "auth/invalid-email":"ئیمەیل یا دروست نینە.",
  "auth/email-already-in-use":"ئەڤ ئیمەیلە بەرێ هاتیە تۆمارکرن.", "auth/weak-password":"وشا نهێنی دڤێت لایەنێ کێم ٦ پیت بن.",
  "auth/too-many-requests":"گەلەک هەوڵ هاتنە دان. پشتی کێمەکێ دووبارە بکە.", "auth/network-request-failed":"پەیوەندیا ئینتەرنێتێ نینە."
}[c] || "کارێ سەرنەکەفت، دووبارە بکە.");

/* ================= auth ================= */
let regMode = false;
onAuthStateChanged(auth, u => {
  S.unsubs.forEach(f => f()); S.unsubs = [];
  S.user = (u && !u.isAnonymous) ? u : null;
  if (!S.user){ $("#shell").classList.add("hide"); $("#login").classList.remove("hide"); return; }
  $("#login").classList.add("hide"); $("#shell").classList.remove("hide");
  S.dresses = []; S.rentals = [];
  const base = ["ledger", S.user.uid];
  const onErr = e => {
    $("#errBox").innerHTML = e.code === "permission-denied"
      ? `<div class="banner">یاسایێن Firebase هێشتا بۆ دەفتەری نەهاتینە نویکرن. فایلا Rules یا نوو ل Firestore دانە و Publish بکە.</div>`
      : `<div class="banner">بارکرنا داتایان سەرنەکەفت. ئینتەرنێتێ پشکنینە.</div>`;
  };
  S.unsubs.push(onSnapshot(collection(db, ...base, "dresses"), q => {
    S.dresses = q.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => ts(b.createdAt)-ts(a.createdAt));
    $("#errBox").innerHTML = ""; render();
  }, onErr));
  S.unsubs.push(onSnapshot(collection(db, ...base, "rentals"), q => {
    S.rentals = q.docs.map(d => ({id:d.id, ...d.data()}));
    render();
  }, onErr));
});

$("#lToggle").addEventListener("click", e => {
  e.preventDefault(); regMode = !regMode;
  $("#lTitle").textContent = regMode ? "هەژمارەکا نوو" : "دەفتەرا پەروکێت بارز";
  $("#lGo").textContent = regMode ? "دروستکرنا هەژمارێ" : "چوونا ژوور";
  $("#lToggle").textContent = regMode ? "هەژمار هەیە؟ چوونا ژوور" : "هەژمارەکا نوو دروست بکە";
  $("#lPass").autocomplete = regMode ? "new-password" : "current-password";
  $("#lMsg").textContent = "";
});
$("#lGo").addEventListener("click", async () => {
  const m = $("#lMsg"); m.className = "msg";
  const email = $("#lEmail").value.trim(), pass = $("#lPass").value;
  if (!email || !pass){ m.classList.add("bad"); m.textContent = "ئیمەیل و وشا نهێنی بنڤیسە."; return; }
  $("#lGo").disabled = true;
  try{ regMode ? await createUserWithEmailAndPassword(auth, email, pass) : await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ m.classList.add("bad"); m.textContent = authErr(e.code); }
  finally{ $("#lGo").disabled = false; }
});
$("#lPass").addEventListener("keydown", e => { if (e.key==="Enter") $("#lGo").click(); });
$("#lForgot").addEventListener("click", async e => {
  e.preventDefault(); const m = $("#lMsg"); m.className = "msg";
  const email = $("#lEmail").value.trim();
  if (!email){ m.classList.add("bad"); m.textContent = "ئیمەیلا خۆ ل سەرێ بنڤیسە، پاشی ل ڤێرێ بدە."; return; }
  try{ await sendPasswordResetEmail(auth, email); m.classList.add("ok"); m.textContent = "لینکا گوهۆڕینا وشا نهێنی بۆ ئیمەیلا تە هاتە ناردن."; }
  catch(err){ m.classList.add("bad"); m.textContent = authErr(err.code); }
});
$("#logout").addEventListener("click", () => signOut(auth));

/* ================= helpers ================= */
const dressOf = id => S.dresses.find(d => d.id === id);
const thumb = d => d && d.img ? `<img src="${esc(d.img)}" alt="" loading="lazy">` : "👗";

function dressState(d){
  const t = todayS();
  const rs = S.rentals.filter(r => r.dressId===d.id && r.status!=="returned").sort((a,b) => a.from.localeCompare(b.from));
  const out = rs.find(r => r.status==="out");
  if (out) return out.to < t ? {cls:"bad", text:"دەمێ زڤڕاندنێ بۆری"} : {cls:"out", text:`ل دەرڤە یە هەتا ${fmt(out.to)}`};
  if (rs.some(r => r.to < t)) return {cls:"bad", text:"دەمێ زڤڕاندنێ بۆری"};
  const next = rs[0];
  if (next) return {cls:"booked", text:`حجزکری: ${fmt(next.from)}`};
  return {cls:"free", text:"بەردەستە"};
}
function groups(){
  const t = todayS(), tm = addD(t,1);
  const act = S.rentals.filter(r => r.status!=="returned");
  const soon = r => { const a = diff(t,r.from), b = diff(t,r.to);
    return (r.status==="booked" && a>=2 && a<=7) || (b>=2 && b<=7); };
  return {
    overdue: act.filter(r => r.to < t),
    pickToday: act.filter(r => r.status==="booked" && r.from===t),
    retToday: act.filter(r => r.to===t),
    pickTom: act.filter(r => r.status==="booked" && r.from===tm),
    retTom: act.filter(r => r.to===tm),
    soon: act.filter(soon)
  };
}

/* ================= rental card ================= */
function rentCard(r){
  const d = dressOf(r.dressId), t = todayS();
  const total = Math.max(0, (r.price||0) - (r.discount||0));
  const days = diff(r.from, r.to) + 1;
  const late = r.status!=="returned" && r.to < t;
  const nextBtn = r.status==="booked" ? `<button class="btn btn-main btn-sm" data-rst="${r.id}" data-to="out">هاتە برن ✓</button>`
    : r.status==="out" ? `<button class="btn btn-ok btn-sm" data-rst="${r.id}" data-to="returned">هاتە زڤڕاندن ✓</button>` : "";
  return `<article class="rent ${late?"late":r.status}">
    <div class="rhead">
      <div class="thumb">${thumb(d)}</div>
      <div class="rinfo"><h3>${esc(r.dressName)}</h3>
        <div class="meta">${esc(r.customer)}${r.phone?` • <a href="tel:${esc(r.phone)}" dir="ltr">${esc(r.phone)}</a>`:""}</div></div>
      <span class="badge ${r.status}">${STATUS[r.status]}</span>

    ${r.note?`<div class="note">تێبینی: ${esc(r.note)}</div>`:""}

/* ================= calendar ================= */
function dayMap(dressId){
  const map = {};
  S.rentals.filter(r => r.dressId===dressId && r.status!=="returned").forEach(r => {
    for (let k = r.from; k <= r.to; k = addD(k,1)) if (!map[k]) map[k] = "busy";
    map[r.from] = "pick"; map[r.to] = "ret"; map[r.wedding] = "wed";
  });
  return map;
}
function calHtml(){
  const {dressId, y, m} = S.cal, map = dayMap(dressId), t = todayS();
  const lead = (new Date(y, m, 1).getDay() + 1) % 7, days = new Date(y, m+1, 0).getDate();
  const lbl = {pick:"برن", wed:"دەوات", ret:"زڤڕ"};
  let cells = WDC.map(w => `<div class="wd">${w}</div>`).join("") + "<div></div>".repeat(lead);
  for (let d = 1; d <= days; d++){
    const k = y+"-"+pad(m+1)+"-"+pad(d), st = map[k]||"";
    cells += `<div class="day ${st} ${k===t?"today":""}">${d}${lbl[st]?`<i>${lbl[st]}</i>`:""}</div>`;
  }
  return `<div class="cal"><div class="cal-head"><button data-cal="-1" aria-label="مەها بەری">›</button><b>${MONTHS[m]} ${y}</b><button data-cal="1" aria-label="مەها پاشی">‹</button></div>
    <div class="cal-grid">${cells}</div>
    <div class="legend"><span style="--c:var(--blue)">برن</span><span style="--c:var(--gold)">دەوات</span><span style="--c:var(--ok)">زڤڕاندن</span><span style="--c:var(--busy)">ل دەرڤە یە</span></div></div>`;
}

async function compressImage(file, max=720, q=0.72){
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  let url = c.toDataURL("image/jpeg", q);
  if (url.length > 700000) url = c.toDataURL("image/jpeg", 0.5);
  return url;
}

/* ================= calendar file (.ics) for phone reminders ================= */
function downloadIcs(id){
  const r = S.rentals.find(x => x.id===id); if (!r) return;
  const e = s => String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g," ");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const evs = [["pick","بردنا کراسی",r.from],["wed","دەوات",r.wedding],["ret","زڤڕاندنا کراسی",r.to]];
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Barz Dresses//Ledger//KU","CALSCALE:GREGORIAN"];
  evs.forEach(([k,label,d]) => {
    L.push("BEGIN:VEVENT", `UID:${r.id}-${k}@barz-dresses`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${addD(d,1).replace(/-/g,"")}`,
      `SUMMARY:${e(label+": "+r.dressName+" — "+r.customer)}`,
      `DESCRIPTION:${e((r.phone?"تەلەفۆن: "+r.phone+". ":"")+"کۆم: "+Math.max(0,(r.price||0)-(r.discount||0))+" د.ع")}`,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${e(label+": "+r.dressName)}`,"TRIGGER;RELATED=START:-PT6H","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${e(label+": "+r.dressName)}`,"TRIGGER;RELATED=START:PT9H","END:VALARM",
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  const blob = new Blob([L.join("\r\n")], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "ijar-barz.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close]"); if (!t) return;
  if (t.hasAttribute("data-close")) return t.closest("dialog").close();
  if (t.dataset.tab){ S.tab = t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if (t.id==="fab"){ S.tab==="dresses" ? openDressForm(null) : openRentForm(null, null); return; }
  if (t.dataset.filter){ S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.dress) return openDress(t.dataset.dress);
  if (t.dataset.cal){
    S.cal.m += Number(t.dataset.cal);
    if (S.cal.m < 0){ S.cal.m = 11; S.cal.y--; } if (S.cal.m > 11){ S.cal.m = 0; S.cal.y++; }
    return renderDress();
  }
  if (t.dataset.newrent) return openRentForm(t.dataset.newrent, null);
  if (t.dataset.dedit) return openDressForm(t.dataset.dedit);
  if (t.dataset.ddel) return delDress(t.dataset.ddel);
  if (t.dataset.redit) return openRentForm(null, t.dataset.redit);
  if (t.dataset.rdel) return delRental(t.dataset.rdel);
  if (t.dataset.rst) return setStatus(t.dataset.rst, t.dataset.to);
  if (t.dataset.ics) return downloadIcs(t.dataset.ics);
  if (t.id==="dfSave") return saveDress();
  if (t.id==="rfSave") return saveRental();
});

  if (e.target.id==="dfImg"){
    const f = e.target.files[0]; if (!f) return;
    try{ S.newImg = await compressImage(f); $("#dfPrev").innerHTML = `<img src="${S.newImg}" alt="">`; }
    catch(err){ $("#dfMsg").className = "msg bad"; $("#dfMsg").textContent = "وێنە نەهاتە خواندن. وێنەیەکا دی تاقی بکە."; }
  }
  if (e.target.id==="rfDress" && !S.editRental){
    const d = dressOf(e.target.value); if (d){ $("#rfPrice").value = d.rentPrice || ""; calcTotal(); }
  }
});
</script>
</body>
</html>
